name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Astro Site
        run: npm run build

      - name: Deploy to utkarshkarale.github.io
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.DEPLOY_PAT }}
          external_repository: UtkarshKarale/utkarshkarale.github.io
          publish_branch: main
          publish_dir: ./dist
          keep_files: true
          commit_message: "Deploy from Utkarsh3696 repo - ${{ github.sha }}"
